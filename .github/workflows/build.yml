name: Build EchoLock (Windows / Mac / HTML5 / Android)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============================================================
  # Windows
  # ============================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe 4.3.4
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install OpenFL + Lime
        shell: cmd
        run: |
          haxelib install openfl --always
          haxelib install lime --always
          haxelib run lime setup

      - name: Build Windows
        shell: cmd
        run: haxelib run lime build windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLock-Windows
          path: Export/windows/bin/

  # ============================================================
  # Mac
  # ============================================================
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe 4.3.4
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install OpenFL + Lime
        run: |
          haxelib install openfl --always
          haxelib install lime --always
          haxelib run lime setup

      - name: Build Mac
        run: haxelib run lime build mac

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLock-Mac
          path: Export/mac/bin/

  # ============================================================
  # HTML5
  # ============================================================
  html5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe 4.3.4
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install OpenFL + Lime
        run: |
          haxelib install openfl --always
          haxelib install lime --always
          haxelib run lime setup

      - name: Build HTML5
        run: haxelib run lime build html5

      - name: Upload HTML5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLock-HTML5
          path: Export/html5/bin/

  # ============================================================
  # Android (Debug APK)
  # ============================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
        continue-on-error: true

      - name: Setup Haxe 4.3.4
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install OpenFL + Lime
        run: |
          haxelib install openfl --always
          haxelib install lime --always
          haxelib run lime setup

      - name: Configure Lime for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          haxelib run lime config android "$ANDROID_SDK_ROOT" "$ANDROID_NDK_HOME"

      - name: Build Android Debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          haxelib run lime build android -debug

      - name: Find APK
        run: find Export/android -name "*.apk" -type f 2>/dev/null || echo "No APK"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLock-Android
          path: Export/android/**/*.apk
